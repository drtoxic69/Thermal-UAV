name: Python Code-Quality Check

on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  lint-type-format-build:

    runs-on: ubuntu-latest
    steps:

      # 1. Checks out your repository's code
      - name: Check out code
        uses: actions/checkout@v4

      # 2. Sets up Python and enables caching for uv
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3. Installs uv
      - name: Install uv
        run: pip install uv

      # 4. Creates the virtual environment (.venv)
      - name: Create Virtual Environment
        run: uv venv
        
      # 5. Installs all CI tools into the virtual environment
      - name: Install Tools (Ruff, Pyright, Pytest)
        run: uv pip install ruff pyright pytest

      # 6. Checks if the project is buildable as a package
      - name: Check Package Build (uv build)
        run: uv build

      # 7. Installs all project dependencies from the lockfile
      - name: Install Project Dependencies
        run: uv sync

      # 8. Runs the linter from within the virtual environment
      - name: Run Linter (Ruff Check)
        run: uv run ruff check .
      
      # 9. Runs the formatter check from within the virtual environment
      - name: Run Formatter (Ruff Format Check)
        run: uv run ruff format --check .
        
      # 10. Runs the type checker from within the virtual environment
      - name: Run Type Checker (Pyright)
        run: uv run pyright .
